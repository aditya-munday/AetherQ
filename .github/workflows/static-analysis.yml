name: static-analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enforce comment and markdown policy
        run: python3 tools/check_policy.py

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          files=$(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx')
          if [ -n "$files" ]; then
            clang-format-18 --dry-run --Werror $files
          fi

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache clang-18 clang-tidy-18
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-tidy-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-tidy-${{ runner.os }}-
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$(python3 -c 'import json;print(json.load(open("vcpkg.json"))["builtin-baseline"])')"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: cmake --preset debug
      - name: Run clang-tidy
        run: |
          clang-tidy-18 -p build/debug --warnings-as-errors='*' \
            $(git ls-files 'src/*.cpp' 'src/**/*.cpp')
