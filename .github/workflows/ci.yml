name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [debug, release]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      CC: ${{ matrix.compiler == 'gcc' && 'gcc-14' || 'clang-18' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++-14' || 'clang++-18' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y gcc-14 g++-14
          else
            sudo apt-get install -y clang-18
          fi
      - name: Restore vcpkg cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.compiler }}-${{ matrix.build_type }}-
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 2024.12.16
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: cmake --preset ${{ matrix.build_type }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }} -j 4
      - name: Test
        run: ctest --preset ${{ matrix.build_type }} --output-on-failure
